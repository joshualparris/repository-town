name: Repository Town Pages Live Release Receipt
on:
  workflow_run:
    workflows: ["Repository Town Pages Alternate"]
    types: [completed]
permissions:
  contents: write
jobs:
  verify-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check public game is the multiplayer main commit, not a stale Pages cache
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        id: check
        env:
          EXPECTED_SOURCE_SHA: b898253a681c6a1b96e6f2d0e8c8238b82532554
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsSL --connect-timeout 10 --max-time 20 "https://joshualparris.github.io/repository-town/release.json?nonce=${GITHUB_RUN_ID}-${attempt}" -o /tmp/town-release.json && node -e "const r=require('/tmp/town-release.json'); if(r.sourceCommit!==process.env.EXPECTED_SOURCE_SHA)process.exit(1);"; then
              echo "live_source=$EXPECTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
              echo "Verified exact public multiplayer source SHA: $EXPECTED_SOURCE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::GitHub Pages never matched the verified multiplayer SHA"
          exit 1
      - name: Persist truthful deployment receipt for audits
        if: always()
        uses: actions/github-script@v7
        env:
          PAGE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VERIFY_CONCLUSION: ${{ steps.check.conclusion }}
          LIVE_SOURCE: ${{ steps.check.outputs.live_source }}
        with:
          script: |
            const success = process.env.PAGE_CONCLUSION === 'success'
              && process.env.VERIFY_CONCLUSION === 'success'
              && process.env.LIVE_SOURCE === 'b898253a681c6a1b96e6f2d0e8c8238b82532554';
            const report = {
              verifiedComplete: success,
              verificationStatus: success ? 'VERIFIED_COMPLETE' : 'BLOCKED',
              exactSourceCommit: process.env.LIVE_SOURCE || null,
              expectedSourceCommit: 'b898253a681c6a1b96e6f2d0e8c8238b82532554',
              pagesWorkflowConclusion: process.env.PAGE_CONCLUSION,
              publicReleaseCheckConclusion: process.env.VERIFY_CONCLUSION,
              pageUrl: 'https://joshualparris.github.io/repository-town/',
              checkedAt: new Date().toISOString(),
              workflowRunId: context.runId,
              sourcePagesRunId: context.payload.workflow_run.id
            };
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='MULTIPLAYER_RELEASE_RECEIPT.json';
            let sha;
            try {
              const existing=await github.rest.repos.getContent({owner,repo,path});
              sha=existing.data.sha;
            } catch(error) {
              if(error.status!==404)throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,sha,
              message: 'audit(pages): record verified multiplayer release SHA and live result',
              content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')
            });
            core.info(JSON.stringify(report));
