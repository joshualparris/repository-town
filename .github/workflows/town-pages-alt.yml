# Release 2026-11-08: publish multiplayer resilience #530 and production protocol v2
# Redeploy request 2026-11-08: canonical JoshMemory main includes multiplayer PR #529 (b898253a).
name: Repository Town Pages Alternate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/town-pages-alt.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: town-pages-alternate
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch canonical source (not the generated backup)
        uses: actions/checkout@v4
        with:
          repository: joshualparris/JoshMemory
          ref: main
          path: source
          persist-credentials: false

      - name: Node 22 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/repository-town/package-lock.json

      - name: Full Release, Privacy and Game Integrity Gate
        working-directory: source/repository-town
        run: |
          npm ci --no-audit --no-fund
          npm run build:release

      - name: Verify exact source and mobile dialogue controls
        working-directory: source/repository-town
        run: |
          node tools/verify-release.mjs dist/public
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('dist/public/release.json')); const sha=require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(p.sourceCommit!==sha)throw Error('Wrong source SHA: '+p.sourceCommit+' expected '+sha);console.log('Source SHA verified:',sha)"
          test -f dist/public/ui/yarn-preferences.js
          grep -q 'town-dialogue-settings' dist/public/ui/yarns.js

      - name: Fetch separately reviewed Steam desktop web runtime
        uses: actions/checkout@v4
        with:
          repository: joshualparris/RepoTown-Desktop
          ref: main
          path: steam-desktop
          persist-credentials: false

      - name: Strict Steam preview privacy gate and in-game integrity
        working-directory: steam-desktop
        run: |
          npm run test:steam-ready
          test -f game/index.html
          test -f game/release.html
          test -f game/engine/input.js
          test -f game/ui/desktop-first-day.js
          test -f game/houses.json

      - name: Publish isolated Steam preview subdirectory
        run: |
          test ! -e source/repository-town/dist/public/steam-preview
          mkdir -p source/repository-town/dist/public/steam-preview
          cp -a steam-desktop/game/. source/repository-town/dist/public/steam-preview/
          test -f source/repository-town/dist/public/steam-preview/index.html
          echo "Published reviewed Steam desktop build into /steam-preview/ without replacing the canonical game."

      - name: Configure or enable GitHub Pages for this independent QA repository
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # Retries of a run must never collide with previous github-pages artifacts.
      # deploy-pages requires exactly one artifact with the configured name.
      - name: Upload verified independent site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/repository-town/dist/public
      - name: Publish GitHub Pages QA deployment
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
