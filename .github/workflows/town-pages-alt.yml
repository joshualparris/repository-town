name: Repository Town Pages Alternate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/town-pages-alt.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: town-pages-alternate
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch canonical source (not the generated backup)
        uses: actions/checkout@v4
        with:
          repository: joshualparris/JoshMemory
          ref: main
          path: source
          persist-credentials: false

      - name: Node 22 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/repository-town/package-lock.json

      - name: Full Release, Privacy and Game Integrity Gate
        working-directory: source/repository-town
        run: |
          npm ci --no-audit --no-fund
          npm run build:release

      - name: Verify exact source and mobile dialogue controls
        working-directory: source/repository-town
        run: |
          node tools/verify-release.mjs dist/public
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('dist/public/release.json')); const sha=require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(p.sourceCommit!==sha)throw Error('Wrong source SHA: '+p.sourceCommit+' expected '+sha);console.log('Source SHA verified:',sha)"
          test -f dist/public/ui/yarn-preferences.js
          grep -q 'town-dialogue-settings' dist/public/ui/yarns.js

      - name: Configure or enable GitHub Pages for this independent QA repository
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload verified independent site
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/repository-town/dist/public
      - name: Publish GitHub Pages QA deployment
        id: deployment
        uses: actions/deploy-pages@v4
